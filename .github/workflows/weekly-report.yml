name: weekly-hr-report

on:
  schedule:
    - cron: '0 0 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup-node
        uses: actions/setup-node@v4
        with:
          # openai 패키지를 npm ci로 버전 고정하면서 확인해보니, 고정한 버전의
          # package.json이 "engines": { "node": ">=22.0.0" }를 요구합니다.
          # 기존에는 20으로 고정돼 있었는데(엄격히 강제되진 않지만) 실제로
          # 검증되지 않은 조합이라 맞춰서 올립니다.
          node-version: '22'
          cache: 'npm'

      - name: install
        # package-lock.json에 고정된 정확한 버전만 설치합니다(npm install처럼
        # "그때그때 latest"를 받아오지 않음) — package.json/lock과 어긋나면
        # 실패하므로, 의존성이 조용히 바뀌는 공급망 리스크를 줄입니다.
        run: npm ci

      - name: generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-report.js

      - name: commit-and-push
        # main으로 하드코딩하지 않고, 이 실행을 트리거한 브랜치로 push합니다
        # (schedule은 항상 main이지만, workflow_dispatch로 다른 브랜치를 골라
        # 수동 실행할 수도 있으므로 항상 맞는 대상으로 push되도록 함).
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "HR Report Bot"
          git config user.email "bot@github.com"
          git add index.html
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "auto: weekly hr report $(date +'%Y-%m-%d')"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
